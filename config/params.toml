# Параметры модели. Всё, что зависит от договорённостей с финансовым директором,
# вынесено сюда — расчёты не содержат «магических чисел».

[report]
as_of = "2026-09-30"            # дата, на которую строятся витрины (в реальном режиме — вчера)
focus_month = "2026-09"         # месяц, который показывает дашборд

[tax]
# Режим согласовать с финансовым директором. Пример: УСН «доходы» 6% + НДС 5% без вычетов
# (порог освобождения от НДС на УСН в 2026 году — 20 млн ₽).
vat_rate_sales = 0.05
usn_rate = 0.06

[economics]
points_max_share = 0.99         # баллами гасится до 99% стоимости услуг (по разъяснениям Ozon)
compensation_coef = 0.41        # коэффициент возмещения для лимита по формуле (FBO, > 300 ₽) — сверить с таблицей
vat_rate_in_card = 0.22         # ставка НДС из карточки — участвует в формуле лимита возмещения

[tolerance]
realization_qty = 0             # допустимое расхождение штук с отчётом о реализации
realization_rub = 1.0
ads_pct = 0.02                  # допустимое расхождение рекламы Performance API vs финансы

[planning]
review_period_days = 7          # как часто принимаем решение о закупке/поставке
service_level_z = 1.65          # ~95% вероятность не уйти в OOS за lead time
overstock_cover_days = 120      # выше — затоваривание
target_cover_days_ozon = 14     # целевой запас на складах Ozon (поставки чаще и меньше)
ff_storage_rub_per_unit_day = 1.5   # хранение на фулфилменте, если тариф поштучный
